# Netlify — static site, no build step
[build]
  publish = "."
  command = ""

# sitemap.xml / robots.txt — short cache so search engines pick up changes quickly
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Hero before/after images — stable filenames, cache aggressively (each deploy purges it)
[[headers]]
  for = "/sandbox*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Homepage — preload both hero images so first paint is faster
[[headers]]
  for = "/"
  [headers.values]
    Link = "</sandboxhero%20before.png>; rel=preload; as=image, </sandbox%20hero%20after.png>; rel=preload; as=image; fetchpriority=high"
